# Local dev dependencies only. The password below is a throwaway for a container
# bound to 127.0.0.1; production secrets live in GCP Secret Manager, never here.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ziro
      POSTGRES_PASSWORD: ziro_dev
      POSTGRES_DB: ziro
    ports:
      # Host port 5433, not 5432: a native Postgres on 5432 is common on dev machines.
      - '127.0.0.1:5433:5432'
    volumes:
      - ziro_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ziro -d ziro']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s

volumes:
  ziro_pg:
